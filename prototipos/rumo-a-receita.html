<meta charset="utf-8">
<title>Alchemix</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  @font-face { font-family: 'Jersey 10'; src: url('Jersey10.woff2') format('woff2'), url('Jersey10.ttf') format('truetype'); font-weight: 400 700; font-display: swap; }
  /* Teste: objetivo final + tabuleiro sempre cheio + descobrir receitas com toques limitados. Visual do protótipo. */
  :root {
    --sky: #7fc4ea; --ink: #2f1f2b; --paper: #f6ecd2; --paper-shade: #d9c49a;
    --grass: #6cc24a; --grass-shade: #3f8f3a; --orange: #f2b134; --orange-shade: #c46a1c;
    --berry: #e2566b; --berry-shade: #9c2f3f; --blue: #4aa3e0; --blue-shade: #2a6db5;
    --wood: #8a5a3b; --wood-dark: #5e3a26; --muted: #7a5a44;
    --display: 'Jersey 10', ui-monospace, monospace;
  }
  * { font-size-adjust: 0.58;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sky) url('img/fundo-vila.webp') center / cover no-repeat fixed; color: var(--ink); font-family: var(--display);
    padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); box-sizing: border-box; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
  .app { height: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-block: 10px; box-sizing: border-box; }
  .box { background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .btn { font-family: var(--display); font-size: 15px; font-weight: 700; color: #fff; border: 3px solid var(--ink); padding: 8px 10px; cursor: pointer; text-shadow: 0 2px 0 var(--ink); min-height: 46px; }
  .btn:active { transform: translateY(2px); }
  .btn:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .btn.paper { background: var(--paper); color: var(--ink); text-shadow: none; box-shadow: 0 4px 0 var(--paper-shade); }
  .btn.green { background: var(--grass); box-shadow: 0 4px 0 var(--grass-shade); }
  .btn.orange { background: var(--orange); box-shadow: 0 4px 0 var(--orange-shade); }
  .btn.blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-shade); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .title { background: var(--grass); color: #fff; text-shadow: 0 3px 0 var(--ink); font-size: 22px; padding: 6px 14px; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--grass-shade); }
  .goal { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
  .goal .lbl { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
  .goal .big { width: 54px; height: 54px; flex: none; }
  .tree { display: flex; align-items: center; gap: 4px; font-size: 18px; flex-wrap: wrap; }
  .slot { width: 34px; height: 34px; border: 2px dashed var(--muted); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--muted); }
  .slot.ok { border-style: solid; border-color: var(--ink); background: #fff; }
  .taps { margin-left: auto; text-align: center; }
  .taps .val { font-size: 26px; }
  .queue { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-size: 13px; color: var(--muted); }
  .queue .q { width: 30px; height: 30px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; }
  .boardwrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .tile img { pointer-events: none; -webkit-user-drag: none; user-drag: none; }
  .board { touch-action: none; background: var(--wood); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink), inset 0 6px 0 var(--grass); padding: 12px 6px 6px; display: grid; gap: 5px; }
  .tile { width: var(--cs); height: var(--cs); display: flex; align-items: center; justify-content: center; border: 2px solid var(--ink); background: var(--t, #eee); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); cursor: pointer; padding: 0; position: relative; transition: transform .12s; }
  .tile.sel { outline: 4px solid #fff; outline-offset: -2px; transform: scale(1.12); z-index: 2; box-shadow: 0 0 0 3px var(--gold, #f6c544), 0 0 18px 6px #fff8; }
  .tile.viz { outline: 3px dashed #fffc; outline-offset: -5px; }
  .slot.pista { border-style: dashed; background: #fff8; }
  .slot.pista .ico { opacity: .4; }
  .tile.hint { outline: 4px dashed var(--orange); outline-offset: -2px; }
  .tile.done { outline: 4px solid #f5c542; outline-offset: -2px; cursor: default; filter: saturate(.85); }
  .tile.done::after { content: '✓'; position: absolute; top: 2px; right: 4px; font-size: 18px; color: #fff; background: #3aa35b; border-radius: 50%; width: 20px; height: 20px; line-height: 20px; text-align: center; }
  .tile.pop { animation: pop .35s ease-out; }
  .tile.boom { animation: boom .35s ease-out; }
  .tile.drop { animation: drop .3s ease-out; }
  .tile.shake { animation: shake .5s ease-in-out; outline: 4px solid var(--berry); outline-offset: -2px; }
  @keyframes shake { 0%, 100% { transform: translateX(0) rotate(0); } 15% { transform: translateX(-7px) rotate(-6deg); } 30% { transform: translateX(6px) rotate(5deg); } 45% { transform: translateX(-5px) rotate(-4deg); } 60% { transform: translateX(4px) rotate(3deg); } 75% { transform: translateX(-2px) rotate(-1deg); } }
  .ico { width: 72%; height: 72%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cs, 40px) * .5); line-height: 1; }
  .ico img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @keyframes boom { 0% { transform: scale(1.3) rotate(-8deg); filter: brightness(2); } 100% { transform: none; } }
  @keyframes drop { 0% { transform: translateY(-30px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .foot { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 10px 14px; font-size: 16px; z-index: 20; max-width: 88%; text-align: center; }
  .modal { position: fixed; inset: 0; background: rgba(34, 20, 30, .6); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  .card { padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; width: min(360px, 100%); max-height: 85vh; overflow: auto; }
  .card h2 { margin: 0; font-size: 24px; }
  .card p { margin: 0; font-size: 15px; color: var(--muted); }
  .card .mascot { width: 84px; margin: 0 auto; image-rendering: pixelated; }
  .book { display: grid; grid-template-columns: 1fr; gap: 6px; text-align: left; }
  .book .row { display: flex; align-items: center; gap: 4px; font-size: 15px; padding: 4px 6px; background: #fff8e6; border: 2px solid var(--ink); }
  .book .row .ico { width: 26px; height: 26px; font-size: 20px; }
  @media (prefers-reduced-motion: reduce) { .tile, .tile.pop, .tile.boom, .tile.drop, .tile.shake { animation: none; transition: none; } }
  /* ---- layout 1 "Arrumado" + visual roxo e dourado ---- */
  :root { --gold: #f6c544; --gold-dark: #c9962e; --night: #2a1033; --night-dark: #1a0b2e; --woodD: #4a2c18; --woodD-dark: #2e1a0e; --lilac: #e9c8ff; }
  body { background: radial-gradient(circle at 84% 5%, #fff6c8 0 16px, #ffe59a55 22px, #0000 64px), linear-gradient(#3b1f6ee6, #7a3fa0aa 30%, #ff9f6a44 60%, #1a0b2e66), url('img/fundo-vila.webp') center / cover no-repeat fixed, #3b1f6e; }
  .night { background: var(--night); color: var(--gold); border: 3px solid var(--night-dark); box-shadow: inset 0 0 0 2px var(--gold-dark), 0 4px 0 var(--night-dark); }
  .box.paper2 { background: #fff4dc; box-shadow: inset 0 0 0 2px var(--gold-dark), 0 4px 0 var(--ink); }
  .btn.wood { background: var(--woodD); color: var(--gold); text-shadow: none; border-color: var(--night-dark); box-shadow: inset 0 0 0 2px var(--gold-dark), 0 4px 0 var(--night-dark); }
  .btn.ib { width: 48px; height: 48px; min-height: 0; padding: 0; display: grid; place-items: center; font-size: 22px; text-decoration: none; text-shadow: none; }
  .top .title { flex: 1; text-align: center; font-size: 26px; padding: 5px 8px; text-shadow: none; }
  .top .title small { font-size: 16px; color: var(--lilac); }
  .goal { gap: 12px; padding: 10px 12px; }
  .goal .big { width: 64px; height: 64px; }
  .goal .big .ico { width: 100%; height: 100%; font-size: 50px; }
  .goal .lbl, .taps .lbl { font-size: 13px; letter-spacing: .05em; color: var(--muted); }
  .gname { font-size: 30px; line-height: 1; margin: 2px 0 4px; }
  .taps .val { font-size: 42px; line-height: 1; }
  #lives { font-size: 15px; white-space: nowrap; }
  .queue.night { padding: 5px 10px; color: var(--gold); }
  .queue .lbl { font-size: 13px; color: var(--lilac); letter-spacing: .05em; }
  .board { background: var(--woodD); border-color: var(--night-dark); box-shadow: inset 0 0 0 2px var(--gold-dark), 0 5px 0 var(--night-dark), 0 0 20px #b46cff55; padding: 8px; }
  .foot { display: flex; justify-content: center; gap: 16px; }
  .foot .btn.ib { width: 60px; height: 60px; font-size: 28px; }
  .card .btn { font-size: 20px; }
  .modal { background: rgba(26, 11, 46, .72); }
  .box.card { background: #fff4dc; border-color: var(--night-dark); box-shadow: inset 0 0 0 3px var(--gold-dark), 0 5px 0 var(--night-dark), 0 0 30px #b46cff66; }
  .card h2 { font-size: 30px; color: var(--night); }
  .card p { font-size: 18px; }
  .card .btn.green { box-shadow: inset 0 0 0 2px var(--gold-dark), 0 4px 0 var(--grass-shade); }
  .card .btn.paper { background: var(--woodD); color: var(--gold); border-color: var(--night-dark); box-shadow: inset 0 0 0 2px var(--gold-dark), 0 4px 0 var(--night-dark); }
  .book .row { background: #fffaf0; border-color: var(--night-dark); font-size: 18px; }
  .box.toast { background: var(--night); color: var(--gold); border-color: var(--night-dark); box-shadow: inset 0 0 0 2px var(--gold-dark), 0 4px 0 var(--night-dark); font-size: 19px; }
  .toast .ico { display: inline-flex; width: 1.5em; height: 1.5em; vertical-align: middle; }
  .moedas { display: flex; align-items: center; padding: 0 8px; min-height: 48px; font-size: 22px; white-space: nowrap; box-sizing: border-box; }
  .aj { position: relative; }
  .mais3 { font: 26px/1 var(--display); color: var(--gold); }
  .ajudas-mini .mais3 { font-size: 17px; }
  .qt { position: absolute; right: -7px; bottom: -7px; min-width: 22px; height: 22px; padding: 0 4px; box-sizing: border-box; background: var(--grass); color: #fff; border: 2px solid var(--night-dark); border-radius: 11px; font: 15px/18px var(--display); text-shadow: none; }
  .qt.preco { background: var(--orange); }
  .qt.livro { background: var(--night); color: var(--gold); font-size: 13px; }
  .qt:empty { display: none; }
  .board.marteloOn { outline: 4px dashed var(--berry); outline-offset: 3px; }
  .board.marteloOn .tile:not(.done) { cursor: crosshair; }
  .frasco { display: flex; gap: 3px; justify-content: center; margin-top: 3px; }
  .frasco span { width: 18px; height: 18px; border: 2px dashed var(--muted); display: grid; place-items: center; box-sizing: border-box; background: #fff8; }
  .frasco span.ok { border: 2px solid var(--grass-shade); background: #e6f6d8; }
  .frasco span.novo { animation: pop .4s ease-out; }
  .frasco .ico { width: 100%; height: 100%; }
  .ajudas-mini { display: none; margin-left: auto; gap: 6px; }
  .ganho { background: #fff8e6; border: 2px solid var(--night-dark); padding: 6px 10px; text-align: left; font-size: 17px; }
  .ganho div { display: flex; justify-content: space-between; }
  .ganho .tot { font-size: 26px; border-top: 2px dashed var(--gold-dark); margin-top: 4px; padding-top: 2px; color: var(--night); }
  .btn.orange.ad { background: var(--orange); box-shadow: inset 0 0 0 2px var(--gold-dark), 0 4px 0 var(--orange-shade); }
  /* celular baixo: encolhe o cabeçalho antes de encolher as casas */
  @media (max-height: 700px) {
    .app { gap: 4px; padding-block: 4px; }
    .btn.ib { width: 40px; height: 40px; font-size: 18px; }
    .top .title { font-size: 20px; padding: 2px 8px; }
    .goal { padding: 4px 10px; gap: 10px; }
    .goal .lbl, .taps .lbl { font-size: 11px; }
    .goal .big { width: 40px; height: 40px; }
    .goal .big .ico { font-size: 30px; }
    .gname { font-size: 20px; margin: 0 0 2px; }
    .slot { width: 24px; height: 24px; font-size: 14px; }
    .taps .val { font-size: 26px; }
    #lives { font-size: 12px; }
    .queue.night { padding: 3px 8px; }
    .queue .q { width: 26px; height: 26px; }
    .foot { display: none; }
    .ajudas-mini { display: flex; }
    .ajudas-mini { gap: 5px; }
    .ajudas-mini .btn.ib { width: 34px; height: 34px; font-size: 16px; }
    .ajudas-mini .qt { right: -6px; bottom: -6px; min-width: 17px; height: 17px; font-size: 11px; line-height: 13px; padding: 0 2px; }
    .ajudas-mini .qt.livro { display: none; }
    .moedas { min-height: 40px; font-size: 18px; padding: 0 6px; }
    .queue .lbl { font-size: 11px; white-space: nowrap; }
    .queue .lbl .txt { display: none; }
    .queue .lbl { font-size: 16px; }
    #queue { gap: 4px !important; }
    .top .title { white-space: nowrap; }
    .top .title small { display: none; }
    .toast { top: calc(50px + env(safe-area-inset-top, 0px)); font-size: 16px !important; }
  }
  /* ---- vitória comemorada ---- */
  .card .mascot.pula { animation: pula .7s ease-in-out infinite alternate; }
  @keyframes pula { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-10px) rotate(4deg); } }
  .estrelas { display: flex; justify-content: center; gap: 6px; }
  .estrelas span { font-size: 44px; line-height: 1; filter: grayscale(1) brightness(.6); opacity: .35; }
  .estrelas span.on { filter: none; opacity: 1; animation: brilha .45s ease-out; }
  @keyframes brilha { 0% { transform: scale(.2) rotate(-40deg); } 60% { transform: scale(1.4) rotate(10deg); } 100% { transform: none; } }
  .novas { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .novas .row { display: flex; align-items: center; gap: 4px; font-size: 18px; }
  .novas .ico { width: 30px; height: 30px; font-size: 22px; }
  .confete { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 31; }
  .confete i { position: absolute; top: -20px; width: 9px; height: 14px; animation: cai linear forwards; }
  @keyframes cai { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .card .mascot.pula, .estrelas span.on, .confete { animation: none; display: none; } .estrelas span.on { display: inline; } }
</style>

<div class="app">
  <div class="top">
    <a class="btn ib night" href="index.html" aria-label="Menu">⌂</a>
    <div class="title night" id="title">FASE 1</div>
    <div class="moedas night" id="moedas" aria-label="Moedas">🪙 0</div>
    <button class="btn ib night" id="pause" aria-label="Pausa">⏸</button>
  </div>
  <div class="box goal paper2">
    <div style="text-align:center;flex:none"><div class="ico big" id="goalIco"></div><div class="frasco" id="frasco" aria-label="progresso do objetivo"></div></div>
    <div style="min-width:0;flex:1">
      <div class="lbl">OBJETIVO</div>
      <div class="gname" id="gname"></div>
      <div class="tree" id="tree"></div>
    </div>
    <div class="taps"><div class="lbl">TOQUES</div><div class="val" id="taps">0</div><div id="lives"></div></div>
  </div>
  <div class="queue night" title="Peças que vão entrar no lugar da 1ª peça que você tocar"><span class="lbl"><span class="txt">PRÓXIMAS </span>➜</span><div id="queue" style="display:flex;gap:6px"></div><div class="ajudas-mini" id="ajudasMini"></div></div>
  <div class="boardwrap"><div class="board" id="board"></div></div>
  <div class="foot" id="ajudas">
    <button class="btn ib wood aj" id="bookb" aria-label="Receitas">📖<span class="qt livro" id="found"></span></button>
    <button class="btn ib wood aj" id="hintb" aria-label="Dica">💡<span class="qt" id="q-dica"></span></button>
    <button class="btn ib wood aj" id="martb" aria-label="Martelo: troca uma peça">🔨<span class="qt" id="q-martelo"></span></button>
    <button class="btn ib wood aj" id="maisb" aria-label="Mais 3 toques"><b class="mais3">+3</b><span class="qt" id="q-toques"></span></button>
  </div>

<script src="regras-normal.js"></script>
<script src="som.js"></script>
<script src="precarga.js"></script>
<script>
(() => {
  const { EL, RECIPES, CHAPTERS, ROWS, COLS, find, producer, leaves, levelInfo, adj, novaFase, jogar, dica, martelar } = AlchemixRegras;

  // só entram no livro as receitas feitas com bases já liberadas
  const visibleRecipes = () => RECIPES.filter(r => known.has(r.k) || leaves(r.r).every(l => G.bases.includes(l)));

  const $ = (id) => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  let level = Number(store.get('receita.level')) || 1;
  let known = new Set(JSON.parse(store.get('receita.book') || '[]'));
  // G = estado da partida (regras-normal.js): cells, queue, taps, lives, done, made...
  let G, sel = null, busy = false, hint = null, novas = [];
  const som = (n, x) => AlchemixSom.tocar(n, x);
  // moedas e ajudas (guardadas no aparelho)
  const PRECO = { dica: 25, martelo: 40, toques: 50 };
  let moedas = Number(store.get('alchemix.moedas')) || 0;
  let aj = (() => { try { return JSON.parse(store.get('alchemix.ajudas')) || null; } catch { return null; } })() || { dica: 3, martelo: 2, toques: 1 };
  let martelo = false, ultimoGanho = 0;
  const salvar = () => { store.set('alchemix.moedas', String(moedas)); store.set('alchemix.ajudas', JSON.stringify(aj)); };
  // usa uma ajuda: gasta do estoque ou compra com moedas. Devolve false se não deu.
  function pagar(nome) {
    if (aj[nome] > 0) { aj[nome]--; salvar(); return true; }
    if (moedas >= PRECO[nome]) { moedas -= PRECO[nome]; salvar(); return true; }
    toast(`Faltam ${PRECO[nome] - moedas} 🪙 — vença fases para ganhar moedas`, 2200); return false;
  }
  const podePagar = (nome) => aj[nome] > 0 || moedas >= PRECO[nome];

  function ico(e) {
    const d = EL[e]; const s = document.createElement('div'); s.className = 'ico';
    if (d && d[2]) { const im = document.createElement('img'); im.src = 'img/elementos/' + d[2] + '.webp'; im.alt = d[0]; im.onerror = () => { s.textContent = d[1]; }; s.append(im); } else s.textContent = d ? d[1] : '?';
    return s;
  }
  function start(n) {
    level = n; store.set('receita.level', String(n));
    const info = levelInfo(n);
    G = novaFase(n);
    // carrega antes as artes que esta fase usa (bases e o caminho do objetivo)
    new Set([...G.bases, ...AlchemixRegras.caminho(G.goal)]).forEach(e => { if (EL[e] && EL[e][2]) new Image().src = 'img/elementos/' + EL[e][2] + '.webp'; });
    sel = null; hint = null; busy = false; novas = [];
    $('title').innerHTML = `FASE ${n} <small>· Cap. ${info.chapter}</small>`;
    render();
    if (n === 1 && !store.get('receita.seen')) { store.set('receita.seen', '1'); help(); }
    else if (info.first === n && n > 1 && Number(store.get('receita.cap') || 1) < info.chapter) {
      store.set('receita.cap', String(info.chapter));
      const nova = info.bases[info.bases.length - 1];
      modal(`<h2>Capítulo ${info.chapter}</h2><p>Nova base desbloqueada!</p><div class="ico" style="width:80px;height:80px;margin:0 auto;font-size:60px" id="nico"></div><h2>${EL[nova][0]}</h2><p>Agora ela aparece no tabuleiro. Que receitas será que ela faz?</p><button class="btn green" data-a="close">Bora!</button>`);
      $('nico').append(ico(nova));
    }
  }
  function slotFor(e, revealed) {
    const s = document.createElement('div'); s.className = 'slot' + (revealed ? ' ok' : '');
    if (revealed) s.append(ico(e)); else s.textContent = '?'; s.title = revealed ? EL[e][0] : 'ainda não descoberto';
    return s;
  }
  function renderTree() {
    $('gname').textContent = EL[G.goal][0];
    // os ingredientes de uma receita só aparecem depois que você descobre essa receita
    const t = $('tree'); t.textContent = '';
    const p = producer(G.goal); const kp = known.has(p.k);
    // pista: se você já conhece os dois ingredientes (por outras receitas), eles aparecem apagados
    const conhece = (e) => G.bases.includes(e) || RECIPES.some(r => r.r === e && known.has(r.k));
    if (!kp && conhece(p.a) && conhece(p.b)) {
      const pista = (e) => { const s = slotFor(e, true); s.className = 'slot pista'; s.title = 'pista: você já conhece este ingrediente'; return s; };
      t.append(pista(p.a), '+', pista(p.b));
    } else t.append(slotFor(p.a, kp), '+', slotFor(p.b, kp));
  }
  // tamanho da peça pelo espaço que sobra de verdade para o tabuleiro (moldura: 2×(8 de margem + 3 de borda))
  function cs() {
    const wrap = document.querySelector('.boardwrap');
    const w = Math.min(wrap.clientWidth, 440) - 24, h = wrap.clientHeight - 24;
    return Math.max(28, Math.min(76, Math.floor(Math.min((w - (COLS - 1) * 5) / COLS, (h - (ROWS - 1) * 5) / ROWS))));
  }
  function render(fx = {}) {
    $('goalIco').textContent = ''; $('goalIco').append(ico(G.goal)); $('goalIco').title = EL[G.goal][0];
    $('moedas').textContent = `🪙 ${moedas}`;
    for (const n of ['dica', 'martelo', 'toques']) { const q = $('q-' + n); q.textContent = aj[n] > 0 ? aj[n] : '🪙' + PRECO[n]; q.classList.toggle('preco', !(aj[n] > 0)); }
    const fr = $('frasco'); fr.textContent = '';
    if (G.count > 1) for (let k = 0; k < G.count; k++) { const sl = document.createElement('span'); if (k < G.made) { sl.className = 'ok' + (fx.encheu === k ? ' novo' : ''); sl.append(ico(G.goal)); } fr.append(sl); }
    $('board').classList.toggle('marteloOn', martelo);
    renderTree();
    $('taps').textContent = G.taps; $('lives').textContent = '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(3 - Math.max(0, G.lives));
    const vis = visibleRecipes();
    $('found').textContent = `${vis.filter(r => known.has(r.k)).length}/${vis.length}`;
    const q = $('queue'); q.textContent = ''; for (const e of G.queue) { const d = document.createElement('div'); d.className = 'q'; d.style.background = EL[e][3]; d.append(ico(e)); q.append(d); }
    const b = $('board'); b.textContent = ''; b.style.gridTemplateColumns = `repeat(${COLS}, auto)`; b.style.setProperty('--cs', cs() + 'px');
    G.cells.forEach((e, i) => {
      const t = document.createElement('button'); t.className = 'tile'; t.style.setProperty('--t', EL[e][3]); t.setAttribute('aria-label', EL[e][0]);
      if (G.done.includes(i)) t.classList.add('done');
      if (i === sel) t.classList.add('sel'); else if (sel !== null && adj(sel, i) && !G.done.includes(i)) t.classList.add('viz'); if (hint && hint.includes(i)) t.classList.add('hint');
      if (fx.pop === i) t.classList.add('pop'); if (fx.boom && fx.boom.includes(i)) t.classList.add('boom'); if (fx.drop === i) t.classList.add('drop'); if (fx.shake && fx.shake.includes(i)) t.classList.add('shake');
      t.dataset.i = i; t.append(ico(e)); t.onclick = () => { if (Date.now() - arrastou < 400) return; tap(i); }; b.append(t);
    });
  }
  function toast(msg, ms = 2000) { const t = $('toast'); t.textContent = ''; msg.split(/(\[\w+\])/).forEach(p => { const m = p.match(/^\[(\w+)\]$/); t.append(m && EL[m[1]] ? ico(m[1]) : p); }); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, ms); }

  // arrastar uma peça até a vizinha = tocar nela e depois na vizinha (o novo nasce onde você soltou)
  let arrasto = null, arrastou = 0;
  $('board').addEventListener('pointerdown', ev => {
    const t = ev.target.closest('.tile'); if (!t || busy || martelo) return;
    arrasto = { i: Number(t.dataset.i), x: ev.clientX, y: ev.clientY };
  });
  $('board').addEventListener('dragstart', ev => ev.preventDefault());
  addEventListener('pointermove', ev => {
    if (!arrasto) return;
    const dx = ev.clientX - arrasto.x, dy = ev.clientY - arrasto.y, lim = cs() * 0.4;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < lim) return;
    const i = arrasto.i; arrasto = null; arrastou = Date.now();
    const j = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? (i % COLS < COLS - 1 ? i + 1 : -1) : (i % COLS ? i - 1 : -1)) : (dy > 0 ? i + COLS : i - COLS);
    if (j < 0 || j >= G.cells.length || busy) return;
    if (G.done.includes(i)) { tap(i); return; }
    sel = i; tap(j);
  });
  addEventListener('pointerup', () => { arrasto = null; });
  addEventListener('pointercancel', () => { arrasto = null; });

  function tap(i) {
    if (busy) return;
    if (martelo) {
      if (G.done.includes(i)) { toast('Essa já conta para o objetivo — escolha outra', 1400); return; }
      if (!pagar('martelo')) { martelo = false; render(); return; }
      martelo = false; martelar(G, i); som('erro'); render({ boom: [i] }); toast(`🔨 Quebrou! Veio [${G.cells[i]}] no lugar`, 1600); return;
    }
    // peça do objetivo já concluída: fica no tabuleiro, mas não se mexe mais
    if (G.done.includes(i)) { toast(`✓ Essa ${EL[G.cells[i]][0]} já conta para o objetivo`, 1400); return; }
    hint = null;
    if (sel === null || sel === i || !adj(sel, i)) { sel = sel === i ? null : i; if (sel !== null) som('toque'); render(); return; }
    const a = sel, b = i; sel = null;
    const res = jogar(G, a, b);
    if (res.tipo === 'receita') {
      const r = res.receita;
      const isNew = !known.has(r.k);
      known.add(r.k); store.set('receita.book', JSON.stringify([...known]));
      if (isNew) novas.push(r);
      som(isNew ? 'novo' : 'acerto');
      render({ pop: b, drop: a });
      if (isNew) toast(`✨ Nova receita! [${r.a}] + [${r.b}] = [${r.r}] ${EL[r.r][0]}`, 2600);
      if (res.venceu) return setTimeout(win, 450);
      if (r.r === G.goal) setTimeout(() => { som('meta'); render({ encheu: G.made - 1 }); toast(`[${G.goal}] ${G.made}/${G.count} — falta${G.count - G.made > 1 ? 'm' : ''} ${G.count - G.made}!`, 1500); }, 350);
      if (res.perdeu) setTimeout(() => lose(res.perdeu), 400);
    } else {
      // não reagiu: as peças tremem e ficam no lugar
      busy = true;
      som('erro');
      render({ shake: [a, b] });
      setTimeout(() => {
        busy = false;
        render();
        if (res.perdeu) return setTimeout(() => lose(res.perdeu), res.perdeu === 'vidas' ? 500 : 400);
        toast(`💥 Não reagiu! −1 ❤️ e −1 toque — suas peças ficaram no lugar.`, 2000);
      }, 520);
    }
  }
  function win() {
    const extra = G.taps; const n = extra >= 2 ? 3 : extra >= 1 ? 2 : 1;
    // moedas: base pela fase, sem erro e toques que sobraram
    const ganho = { linhas: [['Fase ' + level, 10 + 3 * G.need]] };
    if (G.lives >= 3) ganho.linhas.push(['❤️ Sem erro', 10]);
    if (extra > 0) ganho.linhas.push([`👆 ${extra} toque${extra > 1 ? 's' : ''} sobrando`, 5 * extra]);
    ganho.total = ganho.linhas.reduce((a, l) => a + l[1], 0);
    ultimoGanho = ganho.total; moedas += ganho.total; salvar();
    const feitas = novas.map(r => `<div class="row"><span class="ico" data-e="${r.a}"></span>+<span class="ico" data-e="${r.b}"></span>=<span class="ico" data-e="${r.r}"></span> ${EL[r.r][0]}</div>`).join('');
    modal(`<img class="mascot pula" src="img/mascote-frasco.webp" alt="Mascote do Alchemix: um frasco de poção sorridente">
      <h2>Fase completa!</h2>
      <p>Você fez ${G.count > 1 ? G.count + '× ' : ''}<b>${EL[G.goal][0]}</b></p>
      <div class="ico" style="width:70px;height:70px;margin:0 auto;font-size:52px" id="wico"></div>
      <div class="estrelas" aria-label="${n} de 3 estrelas"><span>⭐</span><span>⭐</span><span>⭐</span></div>
      <p>${extra ? `Sobraram ${extra} toque${extra > 1 ? 's' : ''}` : 'No último toque!'}${n < 3 ? ' — sobre 2 toques para 3 estrelas' : ''}</p>
      ${feitas ? `<p>Receitas novas nesta fase:</p><div class="novas">${feitas}</div>` : ''}
      <div class="ganho">${ganho.linhas.map(([t, v]) => `<div><span>${t}</span><span>+${v}</span></div>`).join('')}<div class="tot"><span>Total</span><span>+${ganho.total} 🪙</span></div></div>
      <button class="btn orange ad" data-a="dobrar">▶ Dobrar (anúncio)</button>
      <button class="btn green" data-a="next">Próxima fase ➜</button>`);
    $('wico').append(ico(G.goal));
    $('card').querySelectorAll('[data-e]').forEach(x => x.replaceWith(ico(x.dataset.e)));
    som('vitoria'); render();
    const est = $('card').querySelectorAll('.estrelas span');
    for (let k = 0; k < n; k++) setTimeout(() => { if (est[k]) { est[k].classList.add('on'); som('estrela', k); } }, 550 + k * 380);
    // confete nas cores do jogo
    const c = document.createElement('div'); c.className = 'confete'; c.setAttribute('aria-hidden', 'true');
    const cores = ['#f6c544', '#e9c8ff', '#6cc24a', '#e2566b', '#4aa3e0', '#fff4dc'];
    for (let k = 0; k < 40; k++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = cores[k % cores.length]; p.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; p.style.animationDelay = Math.random() * .6 + 's'; c.append(p); }
    $('modal').append(c);
  }
  function lose(why) {
    if (G.made >= G.count) return;
    const msg = why === 'vidas' ? 'Acabaram as vidas' : 'Acabaram os toques';
    const extra = why === 'vidas' ? '<button class="btn green" data-a="life">+1 ❤️ (anúncio)</button>' : '<button class="btn green" data-a="more">+5 toques (anúncio)</button>';
    som('derrota');
    modal(`<h2>${msg}</h2><p>Faltou pouco para ${EL[G.goal][0]}. As receitas que você descobriu ficam no livro.</p>${extra}<button class="btn paper" data-a="restart">Recomeçar</button>`);
  }
  function modal(html) {
    $('modal').querySelectorAll('.confete').forEach(x => x.remove());
    $('card').innerHTML = html; $('modal').hidden = false;
    $('card').querySelectorAll('[data-a]').forEach(btn => btn.onclick = () => { $('modal').hidden = true; $('modal').querySelectorAll('.confete').forEach(x => x.remove()); ({ restart: () => start(level), next: () => start(level + 1), close: () => {}, skip: () => start(level + 1), help: () => help(), more: () => anuncio(addMore), dobrar, som: () => { AlchemixSom.alternar(); pausa(); }, life: () => anuncio(() => { G.lives = 1; render(); toast('+1 ❤️'); }) })[btn.dataset.a](); });
  }
  function addMore() { G.taps += 5; render(); toast('+5 toques'); }
  // anúncio com recompensa (simulado; aqui entra o AdMob)
  function anuncio(depois) {
    modal(`<h2>📺 Anúncio</h2><p>Simulado — aqui entra o anúncio em vídeo.</p><p style="font-size:44px" id="cont">3</p>`);
    let k = 3; const t = setInterval(() => { k--; const c = $('cont'); if (c) c.textContent = k; if (k <= 0) { clearInterval(t); $('modal').hidden = true; depois(); } }, 1000);
  }
  function dobrar() { anuncio(() => { moedas += ultimoGanho; salvar(); render(); som('vitoria'); modal(`<h2>Moedas dobradas!</h2><p style="font-size:34px">+${ultimoGanho} 🪙</p><p>Agora você tem ${moedas} 🪙</p><button class="btn green" data-a="next">Próxima fase ➜</button>`); }); }
  function help() {
    modal(`<h2>Como jogar</h2><p>Chegue ao <b>objetivo</b> lá em cima juntando peças.</p><p>Toque numa peça e depois numa <b>vizinha</b> (elas ficam marcadas) — ou <b>arraste</b> a peça até a vizinha. Se for uma receita, o elemento novo <b>nasce na 2ª peça</b> que você tocou, e a 1ª recebe a próxima peça da faixa <b>PRÓXIMAS ➜</b>.</p><p>Não reagiu? 💥 <b>Tira uma vida ❤️ e 1 toque</b>. As peças <b>ficam no lugar</b>. São 3 vidas por fase.</p><p>Os <b>?</b> do objetivo se revelam conforme você descobre. Use poucos toques para ganhar mais estrelas.</p><p>Ajudas: 💡 dica, 🔨 troca uma peça e <b>+3</b> dá 3 toques. Quando o estoque acaba, compre com 🪙 — você ganha moedas vencendo fases (mais ainda sem errar e com toques sobrando).</p><button class="btn green" data-a="close">Bora!</button>`);
  }
  function book() {
    const vis = visibleRecipes(); const got = vis.filter(r => known.has(r.k)).length;
    const locked = RECIPES.length - vis.length;
    const rows = vis.map(r => known.has(r.k)
      ? `<div class="row"><span class="ico" data-e="${r.a}"></span>+<span class="ico" data-e="${r.b}"></span>=<span class="ico" data-e="${r.r}"></span> ${EL[r.r][0]}</div>`
      : `<div class="row" style="opacity:.55">? + ? = ?</div>`).join('');
    modal(`<h2>Receitas (${got}/${vis.length})</h2><div class="book">${rows}</div>${locked ? '<p>🔒 Mais receitas chegam com a próxima base.</p>' : ''}<button class="btn green" data-a="close">Fechar</button>`);
    $('card').querySelectorAll('[data-e]').forEach(s => { s.replaceWith(ico(s.dataset.e)); });
  }
  const pausa = () => modal(`<h2>Pausa</h2><button class="btn green" data-a="close">▶ Continuar</button><button class="btn wood" data-a="som">${AlchemixSom.ligado() ? '🔊 Som: ligado' : '🔇 Som: desligado'}</button><button class="btn wood" data-a="restart">↺ Recomeçar fase</button><button class="btn wood" data-a="skip">⏭ Pular fase</button><button class="btn wood" data-a="help">? Como jogar</button>`);
  $('pause').onclick = pausa;
  $('bookb').onclick = book;
  $('martb').onclick = () => { if (martelo) { martelo = false; render(); toast('Martelo guardado', 1000); return; } if (!podePagar('martelo')) { pagar('martelo'); return; } martelo = true; sel = null; hint = null; render(); toast('🔨 Toque na peça que quer quebrar (de novo no 🔨 para cancelar)', 2400); };
  $('maisb').onclick = () => { if (pagar('toques')) { G.taps += 3; som('meta'); render(); toast('+3 toques', 1400); } };
  // celular baixo: as ajudas sobem para a faixa PRÓXIMAS
  const baixo = matchMedia('(max-height: 700px)');
  const posicionar = () => { const d = baixo.matches ? $('ajudasMini') : $('ajudas'); ['bookb', 'hintb', 'martb', 'maisb'].forEach(id => d.append($(id))); };
  posicionar(); baixo.addEventListener ? baixo.addEventListener('change', posicionar) : baixo.addListener(posicionar);
  $('hintb').onclick = () => { const h = dica(G); if (!h) { toast('Daqui não dá mais para chegar ao objetivo — recomece a fase no ⏸', 2600); return; } if (!pagar('dica')) return; hint = h; sel = null; render(); toast('Junte as peças marcadas'); };
  window.addEventListener('resize', () => render());
  start(level);
})();
</script>
