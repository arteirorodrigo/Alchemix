<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alchemix - Modo Livre</title>
<style>
  /* TESTE PROVISÓRIO do Modo Livre: junte vizinhos, finais somem e pontuam, peças caem e entram bases no topo. */
  @font-face { font-family: 'Jersey 10'; src: url('../Jersey10.ttf') format('truetype'); font-weight: 400 700; }
  :root {
    --ink: #2a1033; --paper: #f6ecd2; --paper-shade: #d9c49a; --gold: #f6c544; --gold-dark: #c9962e;
    --night: #2a1033; --wood: #4a2c18; --wood-dark: #2e1a0e; --grass: #5dbb4a; --grass-shade: #2e6b24;
    --berry: #e2566b; --muted: #7a5a44; --display: 'Jersey 10', ui-monospace, monospace;
  }
  * { font-size-adjust: 0.58;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { color: var(--ink); font-family: var(--display); overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent;
    background: linear-gradient(#3b1f6ee6, #7a3fa0aa 30%, #ff9f6a44 60%, #1a0b2e66), url('img/fundo-vila.webp') center / cover no-repeat fixed, #3b1f6e;
    padding: 0 max(12px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
  .app { height: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; box-sizing: border-box; }
  .btn { font-family: var(--display); font-size: 16px; font-weight: 700; color: #fff; border: 3px solid var(--ink); padding: 8px 12px; cursor: pointer; text-shadow: 0 2px 0 var(--ink); min-height: 46px; }
  .btn:active { transform: translateY(2px); }
  .btn.green { background: var(--grass); box-shadow: 0 4px 0 var(--grass-shade), inset 0 0 0 2px var(--gold-dark); }
  .btn.wood { background: var(--wood); color: var(--gold); box-shadow: 0 4px 0 var(--wood-dark), inset 0 0 0 2px var(--gold-dark); text-shadow: none; }
  .hud { display: flex; gap: 8px; }
  .top { display: flex; align-items: center; gap: 6px; }
  .night { background: var(--night); color: var(--gold); border: 3px solid #1a0b2e; box-shadow: inset 0 0 0 2px var(--gold-dark), 0 4px 0 #1a0b2e; }
  .ib { width: 48px; height: 48px; display: grid; place-items: center; font-size: 22px; text-decoration: none; cursor: pointer; font-family: var(--display); }
  .top .title { flex: 1; text-align: center; font-size: 26px; padding: 5px 8px; }
  .top .title small { font-size: 16px; color: #e9c8ff; }
  .card .btn { font-size: 21px; }
  .chip { flex: 1; background: var(--night); color: var(--gold); border: 3px solid #1a0b2e; box-shadow: 0 4px 0 #1a0b2e, inset 0 0 0 2px var(--gold-dark); text-align: center; padding: 6px 4px; }
  .chip .lbl { font-size: 11px; letter-spacing: .08em; color: #e9c8ff; }
  .chip .val { font-size: 28px; }
  .chip.warn .val { color: #ff8a8a; }
  .boardwrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .board { background: var(--wood); border: 3px solid #1a0b2e; box-shadow: 0 5px 0 #1a0b2e, inset 0 0 0 2px var(--gold-dark), 0 0 24px #b46cff66; padding: 8px; display: grid; gap: 5px; }
  .tile { width: var(--cs); height: var(--cs); display: flex; align-items: center; justify-content: center; border: 2px solid var(--ink); background: var(--t, #eee); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); cursor: pointer; padding: 0; position: relative; transition: transform .12s; }
  .tile.sel { outline: 4px solid #fff; outline-offset: -2px; transform: scale(1.07); z-index: 2; }
  .tile.fim::after { content: '★'; position: absolute; top: 1px; right: 3px; font-size: 13px; color: var(--gold-dark); }
  .tile.pop { animation: pop .35s ease-out; }
  .tile.drop { animation: drop .28s ease-out; }
  .tile.shake { animation: shake .45s ease-in-out; outline: 4px solid var(--berry); outline-offset: -2px; }
  .tile.gone { animation: gone .35s ease-in forwards; }
  .ico { width: 72%; height: 72%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cs, 40px) * .5); line-height: 1; }
  .ico img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @keyframes drop { 0% { transform: translateY(calc(var(--cs) * -1)); } 100% { transform: none; } }
  @keyframes gone { 0% { transform: scale(1); filter: brightness(1); } 40% { transform: scale(1.35); filter: brightness(2.2); } 100% { transform: scale(0); opacity: 0; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px) rotate(-6deg); } 40% { transform: translateX(6px) rotate(5deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .float { position: fixed; z-index: 15; font-size: 26px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); pointer-events: none; animation: up 1s ease-out forwards; white-space: nowrap; transform: translateX(-50%); }
  @keyframes up { 0% { opacity: 0; margin-top: 0; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -70px; } }
  .modal { position: fixed; inset: 0; background: rgba(26, 11, 46, .7); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  .card { background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink), inset 0 0 0 2px var(--gold-dark); padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; width: min(360px, 100%); max-height: 85vh; overflow: auto; }
  .card h2 { margin: 0; font-size: 26px; }
  .card p { margin: 0; font-size: 15px; color: var(--muted); }
  .card .mascot { width: 84px; margin: 0 auto; image-rendering: pixelated; }
  .book { display: grid; gap: 5px; text-align: left; }
  .book .row { display: flex; align-items: center; gap: 4px; font-size: 14px; padding: 3px 6px; background: #fff8e6; border: 2px solid var(--ink); }
  .book .row .ico { width: 24px; height: 24px; font-size: 18px; }
  .book .pts { margin-left: auto; color: var(--gold-dark); font-weight: 700; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="ib night" href="../index.html#livre" aria-label="Menu">⌂</a>
    <div class="title night" id="title">MODO LIVRE</div>
    <button class="ib night" id="pause" aria-label="Pausa">⏸</button>
  </div>
  <div class="hud">
    <div class="chip"><div class="lbl">PONTOS</div><div class="val" id="score">0</div></div>
    <div class="chip" id="limChip"><div class="lbl" id="limLbl">TEMPO</div><div class="val" id="lim">60</div></div>
    <div class="chip"><div class="lbl">RECORDE</div><div class="val" id="best">0</div></div>
  </div>
  <div class="boardwrap"><div class="board" id="board"></div></div>
</div>
<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>

<script>
(() => {
  const EL = {
    agua: ['Água', '💧', 'agua', '#cde8f8'], terra: ['Terra', '🟫', 'pedra', '#dfe1e8'], fogo: ['Fogo', '🔥', 'fogo', '#fde3b0'],
    vida: ['Vida', '🌱', 'planta', '#d6f0c4'], vento: ['Vento', '🌬️', null, '#e6f3f8'], barro: ['Barro', '🟤', 'barro', '#ecd9c0'], tijolo: ['Tijolo', '🧱', 'tijolo', '#f2cdbd'],
    vapor: ['Vapor', '☁️', 'vapor', '#f1f6fb'], flor: ['Flor', '🌸', 'flor', '#f8dbe6'], casinha: ['Casinha', '🏠', 'casinha', '#fbeeb8'],
    arcoiris: ['Arco-íris', '🌈', 'arcoiris', '#d6f2f2'], lava: ['Lava', '🌋', null, '#f7c3a6'], obsidiana: ['Obsidiana', '🖤', null, '#d6d0dc'],
    cinza: ['Cinza', '⚫', null, '#dedad6'], sabao: ['Sabão', '🧼', null, '#e2f1fb'], nuvem: ['Nuvem', '🌥️', null, '#eef2f7'],
    chuva: ['Chuva', '🌧️', null, '#d5e4f3'], musgo: ['Musgo', '🍀', null, '#d4ecc7'], pantano: ['Pântano', '🐸', null, '#cfe3c2'],
    sol: ['Sol', '☀️', null, '#fdeeb0'], areia: ['Areia', '🏜️', null, '#f4e2bd'], vidro: ['Vidro', '🔷', null, '#d9ecf8'], vaso: ['Vaso', '🏺', null, '#efd6bf'],
    lago: ['Lago', '🏞️', null, '#cfe6f2'], montanha: ['Montanha', '⛰️', null, '#e2e0dc'], arbusto: ['Arbusto', '🌿', null, '#cfeac0'],
    arvore: ['Árvore', '🌳', null, '#cde8bf'], minerio: ['Minério', '🪙', null, '#efe2b8'], metal: ['Metal', '⚙️', null, '#dde2e8'],
    passaro: ['Pássaro', '🐦', null, '#e3eefa'], raio: ['Raio', '⚡', null, '#fff1a8'], onda: ['Onda', '🌊', null, '#cfe4f6'], poeira: ['Poeira', '🌫️', null, '#e8e3da'],
    tornado: ['Tornado', '🌪️', null, '#dfe4ea'], tempestade: ['Tempestade', '⛈️', null, '#cfd7e3'], praia: ['Praia', '🏖️', null, '#f6e6c0'],
  };
  const BASE = ['agua', 'fogo', 'terra', 'vento', 'vida'];
  const R = (a, b, r) => ({ a, b, r });
  const RECIPES = [
    R('agua','terra','barro'), R('agua','fogo','vapor'), R('vida','agua','flor'), R('fogo','terra','lava'), R('vida','terra','musgo'),
    R('vida','fogo','cinza'), R('agua','agua','lago'), R('terra','terra','montanha'), R('fogo','fogo','sol'), R('vida','vida','arbusto'),
    R('barro','fogo','tijolo'), R('flor','vapor','arcoiris'), R('vapor','vapor','nuvem'), R('lava','agua','obsidiana'), R('lava','terra','minerio'),
    R('sol','terra','areia'), R('cinza','agua','sabao'), R('musgo','agua','pantano'), R('tijolo','tijolo','casinha'), R('nuvem','agua','chuva'),
    R('arbusto','chuva','arvore'), R('areia','fogo','vidro'), R('minerio','fogo','metal'), R('barro','barro','vaso'),
    R('vento','fogo','raio'), R('vento','agua','onda'), R('vento','terra','poeira'), R('vento','vento','tornado'), R('nuvem','raio','tempestade'), R('areia','onda','praia'), R('vida','vento','passaro'),
  ];
  const find = (x, y) => RECIPES.find(r => (r.a === x && r.b === y) || (r.a === y && r.b === x));
  const producer = (e) => RECIPES.find(r => r.r === e);
  const leaves = (e) => { const p = producer(e); return !p || BASE.includes(e) ? [e] : [...leaves(p.a), ...leaves(p.b)]; };
  const points = (e) => leaves(e).length - 1; // nº de combinações para chegar nele
  const used = new Set(RECIPES.flatMap(r => [r.a, r.b]));
  const isFinal = (e) => !BASE.includes(e) && !used.has(e);

  const ROWS = 6, COLS = 5, TIME = 60, TAPS = 30;
  const $ = (id) => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const rnd = () => BASE[Math.floor(Math.random() * BASE.length)];

  let mode = 'tempo', cells = [], sel = null, score = 0, left = 0, timer = null, busy = false, playing = false, made = 0;

  function ico(e) {
    const s = document.createElement('div'); s.className = 'ico'; const d = EL[e];
    if (d[2]) { const im = document.createElement('img'); im.src = 'img/' + d[2] + '.png'; im.alt = d[0]; s.append(im); } else s.textContent = d[1];
    return s;
  }
  function cs() { const w = Math.min(window.innerWidth - 24, 440) - 16, h = window.innerHeight - 250; return Math.max(44, Math.min(78, Math.floor(Math.min((w - (COLS - 1) * 5) / COLS, (h - (ROWS - 1) * 5) / ROWS)))); }
  const bestKey = () => 'livre.best.' + mode;

  function render(fx = {}) {
    $('score').textContent = score;
    $('lim').textContent = left; $('limLbl').textContent = mode === 'tempo' ? 'TEMPO' : 'TOQUES';
    $('limChip').classList.toggle('warn', left <= (mode === 'tempo' ? 10 : 5));
    $('best').textContent = store.get(bestKey()) || 0;
    const b = $('board'); b.textContent = ''; b.style.gridTemplateColumns = `repeat(${COLS}, auto)`; b.style.setProperty('--cs', cs() + 'px');
    cells.forEach((e, i) => {
      const t = document.createElement('button'); t.className = 'tile';
      if (!e) { t.style.visibility = 'hidden'; b.append(t); return; }
      t.style.setProperty('--t', EL[e][3]); t.setAttribute('aria-label', EL[e][0]);
      if (i === sel) t.classList.add('sel');
      if (fx.pop === i) t.classList.add('pop');
      if (fx.drop && fx.drop.has(i)) t.classList.add('drop');
      if (fx.shake && fx.shake.includes(i)) t.classList.add('shake');
      if (fx.gone === i) t.classList.add('gone');
      t.append(ico(e)); t.onclick = () => tap(i); b.append(t);
    });
  }
  const adj = (a, b) => { const ra = Math.floor(a / COLS), ca = a % COLS, rb = Math.floor(b / COLS), cb = b % COLS; return Math.abs(ra - rb) + Math.abs(ca - cb) === 1; };

  function floatText(i, txt) {
    const tile = $('board').children[i]; if (!tile) return;
    const r = tile.getBoundingClientRect(); const f = document.createElement('div'); f.className = 'float'; f.textContent = txt;
    f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = r.top + 'px'; document.body.append(f); setTimeout(() => f.remove(), 1000);
  }

  // peças caem para ocupar os buracos; bases aleatórias entram no topo de cada coluna
  function gravity() {
    const moved = new Set();
    for (let c = 0; c < COLS; c++) {
      const col = []; for (let r = ROWS - 1; r >= 0; r--) { const e = cells[r * COLS + c]; if (e) col.push([e, r]); }
      for (let r = ROWS - 1, k = 0; r >= 0; r--, k++) {
        const i = r * COLS + c;
        if (k < col.length) { cells[i] = col[k][0]; if (col[k][1] !== r) moved.add(i); }
        else { cells[i] = rnd(); moved.add(i); }
      }
    }
    return moved;
  }

  // existe algum par de vizinhos que reage?
  function hasMove() {
    for (let i = 0; i < cells.length; i++) {
      if (i % COLS < COLS - 1 && find(cells[i], cells[i + 1])) return true;
      if (i + COLS < cells.length && find(cells[i], cells[i + COLS])) return true;
    }
    return false;
  }
  function settle(m) { busy = false; render({ drop: m }); if (playing && !hasMove()) setTimeout(() => end(true), 500); }

  function spend() { if (mode === 'toques') { left--; if (left <= 0) setTimeout(end, 500); } }

  function tap(i) {
    if (busy || !playing) return;
    if (sel === null || sel === i || !adj(sel, i)) { sel = sel === i ? null : i; render(); return; }
    const a = sel, b = i; sel = null;
    const r = find(cells[a], cells[b]);
    if (!r) {
      spend(); busy = true; render({ shake: [a, b] });
      return setTimeout(() => { busy = false; render(); }, 450);
    }
    spend(); made++;
    cells[b] = r.r; cells[a] = null;
    busy = true;
    render({ pop: b });
    if (isFinal(r.r)) {
      const p = points(r.r);
      setTimeout(() => {
        score += p; render({ gone: b }); floatText(b, `+${p} ${EL[r.r][0]}`);
        setTimeout(() => { cells[b] = null; settle(gravity()); }, 330);
      }, 260);
    } else {
      setTimeout(() => settle(gravity()), 160);
    }
  }

  function start(m) {
    mode = m; score = 0; sel = null; busy = false; made = 0;
    left = mode === 'tempo' ? TIME : TAPS;
    do cells = Array.from({ length: ROWS * COLS }, rnd); while (!hasMove());
    $('title').innerHTML = `MODO LIVRE <small>· ${mode === 'tempo' ? 'Tempo' : 'Toque'}</small>`;
    $('modal').hidden = true; playing = true; render({ drop: new Set(cells.map((_, i) => i)) });
    clearInterval(timer);
    if (mode === 'tempo') timer = setInterval(() => { left--; render(); if (left <= 0) end(); }, 1000);
  }

  function end(stuck = false) {
    if (!playing) return;
    playing = false; clearInterval(timer);
    const best = Number(store.get(bestKey()) || 0); const rec = score > best; if (rec) store.set(bestKey(), String(score));
    render();
    modal(`<img class="mascot" src="img/mascote-frasco.png" alt=""><h2>${rec ? 'Novo recorde!' : stuck ? 'Travou!' : 'Fim!'}</h2>${stuck ? '<p>Nenhum vizinho reage mais.</p>' : ''}<p style="font-size:40px;color:var(--ink)">${score} pontos</p><p>${made} combinações · recorde ${Math.max(best, score)}</p>
      <button class="btn green" data-m="${mode}">Jogar de novo</button><button class="btn wood" data-a="menu">Menu</button>`);
  }

  function menu() {
    playing = false; clearInterval(timer);
    modal(`<img class="mascot" src="img/mascote-frasco.png" alt=""><h2>Modo Livre</h2>
      <p>Junte vizinhos. Quando chegar num <b>final ★</b> (que não combina com mais nada), ele some e vale pontos: quanto mais longa a receita, mais pontos.</p>
      <p>Lago = 1 · Montanha = 1 · Vidro = 3 · Casinha = 5</p>
      <button class="btn green" data-m="tempo">⏱ 1 minuto</button><button class="btn green" data-m="toques">👆 ${TAPS} toques</button>
      <p style="font-size:12px">Sem livro de receitas. Se nenhum vizinho reagir, a partida acaba.</p>`);
  }

  function modal(html) { $('card').innerHTML = html; $('modal').hidden = false; }
  $('card').addEventListener('click', (ev) => {
    const t = ev.target.closest('button'); if (!t) return;
    if (t.dataset.m) return start(t.dataset.m);
    if (t.dataset.a === 'menu') { location.href = '../index.html#livre'; return; }
  });
  const tick = () => { left--; render(); if (left <= 0) end(); };
  $('pause').onclick = () => {
    if (!playing) return;
    clearInterval(timer);
    modal(`<h2>Pausa</h2><button class="btn green" data-a="continuar">▶ Continuar</button><button class="btn wood" data-m="${mode}">↺ Recomeçar</button><button class="btn wood" data-a="menu">⌂ Menu</button>`);
  };
  $('card').addEventListener('click', (ev) => {
    const t = ev.target.closest('button');
    if (t && t.dataset.a === 'continuar') { $('modal').hidden = true; clearInterval(timer); if (mode === 'tempo' && playing) timer = setInterval(tick, 1000); }
  });
  window.addEventListener('resize', () => render());
  const m0 = new URLSearchParams(location.search).get('m');
  cells = Array.from({ length: ROWS * COLS }, rnd);
  if (m0 === 'tempo' || m0 === 'toques') start(m0); else { render(); menu(); }
})();
</script>
</body>
</html>
